                <div className="rounded-3xl bg-[#1C1C1A] border border-stone-800 p-6 space-y-4">
                  <div className="flex justify-between items-center pb-3 border-b border-stone-800">
                    <h3 className="font-serif text-lg font-bold text-white">Live Reservations Master</h3>
                    <span className="text-xs text-stone-400">Real-time status updates</span>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="border-b border-stone-800 text-stone-400 uppercase">
                          <th className="pb-3">Reference</th>
                          <th className="pb-3">Guest Contact</th>
                          <th className="pb-3">Restaurant & Table</th>
                          <th className="pb-3">Date & Time</th>
                          <th className="pb-3">Status</th>
                          <th className="pb-3 text-right">Action</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-stone-800">
                        {bookings.map(b => (
                          <tr key={b.id} className="hover:bg-stone-900/50">
                            <td className="py-3 font-mono font-bold text-amber-400">{b.bookingReference}</td>
                            <td className="py-3 font-medium text-white">{b.customerName} <br/><span className="text-stone-400 text-[10px]">{b.customerEmail}</span></td>
                            <td className="py-3">{b.restaurantName} <br/><span className="text-amber-500/80 text-[10px]">{b.tableNumber} ({b.zone})</span></td>
                            <td className="py-3">{b.bookingDate} at {b.bookingTime}</td>
                            <td className="py-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${b.status==='CONFIRMED'?'bg-emerald-950 text-emerald-400':'bg-red-950 text-red-400'}`}>
                                {b.status}
                              </span>
                            </td>
                            <td className="py-3 text-right">
                              {b.status === 'CONFIRMED' ? (
                                <button
                                  onClick={() => {
                                    setBookings(prev => prev.map(x => x.id === b.id ? { ...x, status: 'CANCELLED' } : x));
                                    showToast(`Cancelled reservation ${b.bookingReference}`);
                                  }}
                                  className="text-red-400 hover:underline text-[11px]"
                                >
                                  Cancel
                                </button>
                              ) : (
                                <button
                                  onClick={() => {
                                    setBookings(prev => prev.map(x => x.id === b.id ? { ...x, status: 'CONFIRMED' } : x));
                                    showToast(`Reinstated reservation ${b.bookingReference}`);
                                  }}
                                  className="text-emerald-400 hover:underline text-[11px]"
                                >
                                  Reinstate
                                </button>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* ================= 3. 5-STEP TABLE BOOKING MODAL ================= */}
          {bookingRestaurant && (
            <BookingModal
              restaurant={bookingRestaurant}
              tables={tables.filter(t => t.restaurantId === bookingRestaurant.id)}
              existingBookings={bookings}
              currentUser={currentUser}
              onClose={() => setBookingRestaurant(null)}
              onConfirmBooking={(newBooking) => {
                setBookings(prev => [newBooking, ...prev]);
                addNotification('Reservation Confirmed', `Booked ${newBooking.tableNumber} at ${newBooking.restaurantName}`);
              }}
            />
          )}

          {/* ================= 4. AUTH MODAL ================= */}
          {authOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-[#1C1C1A] rounded-3xl border border-stone-800 p-8 max-w-sm w-full space-y-6 text-center">
                <h3 className="font-serif text-2xl font-bold text-white">Sign In to AURA</h3>
                <p className="text-xs text-stone-400">Choose a quick demo persona to explore the app:</p>
                <div className="space-y-3">
                  <button 
                    onClick={() => { setCurrentUser(INITIAL_USERS[1]); setAuthOpen(false); showToast('Logged in as Eleanor Vance (Customer)'); }}
                    className="w-full py-3 rounded-xl bg-stone-900 hover:bg-stone-800 text-stone-200 text-xs font-bold uppercase border border-stone-700"
                  >
                    👤 Guest Persona (Customer)
                  </button>
                  <button 
                    onClick={() => { setCurrentUser(INITIAL_USERS[0]); setAuthOpen(false); showToast('Logged in as Alexander Hamilton (Admin)'); }}
                    className="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold uppercase"
                  >
                    🛡 Executive Admin Persona
                  </button>
                </div>
                <button onClick={() => setAuthOpen(false)} className="text-xs text-stone-500 hover:text-white">Close</button>
              </div>
            </div>
          )}

          {/* ================= 5. TOASTS ================= */}
          <div className="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className="pointer-events-auto p-4 rounded-2xl bg-[#1C1C1A] border border-amber-500/50 text-white text-xs shadow-2xl flex items-center gap-3">
                <span className="w-2 h-2 rounded-full bg-amber-400"></span>
                <span>{t.msg}</span>
              </div>
            ))}
          </div>

          {/* ================= 6. FOOTER ================= */}
          <footer className="bg-[#0c0c0b] border-t border-stone-800 text-stone-400 text-xs py-12 mt-20">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex flex-col sm:flex-row items-center justify-between gap-4">
              <div className="flex items-center gap-2">
                <span className="text-amber-500 font-bold">✦ AURA</span>
                <span>• Haute Hospitality & Guaranteed Table Seating</span>
              </div>
              <p>© 2026 AURA Inc. All rights reserved.</p>
            </div>
          </footer>

        </div>
      );
    }

    // --- MODAL: 5-STEP TABLE BOOKING COMPONENT ---
    function BookingModal({ restaurant, tables, existingBookings, currentUser, onClose, onConfirmBooking }) {
      const [step, setStep] = useState(1);
      const [date, setDate] = useState("2026-11-20");
      const [time, setTime] = useState("19:30");
      const [guests, setGuests] = useState(2);
      const [selectedTable, setSelectedTable] = useState(null);
      const [guestName, setGuestName] = useState(currentUser?.fullName || "Eleanor Vance");
      const [guestEmail, setGuestEmail] = useState(currentUser?.email || "customer@tableprime.com");
      const [guestPhone, setGuestPhone] = useState("+1 (555) 234-5678");
      const [occasion, setOccasion] = useState("Anniversary");
      const [specialRequests, setSpecialRequests] = useState("Window seating requested.");
      const [confirmedRef, setConfirmedRef] = useState(null);

      // Check real-time table availability against existing bookings
      const computedTables = useMemo(() => {
        return tables.map(t => {
          const isConflict = existingBookings.some(b => 
            b.restaurantId === restaurant.id &&
            b.tableId === t.id &&
            b.bookingDate === date &&
            b.bookingTime === time &&
            b.status !== 'CANCELLED'
          );
          return {
            ...t,
            isAvailable: !isConflict
          };
        });
      }, [tables, existingBookings, restaurant, date, time]);

      const handleConfirm = () => {
        // Concurrency / double-booking check
        const conflict = existingBookings.find(b => 
          b.restaurantId === restaurant.id &&
          b.tableId === selectedTable.id &&
          b.bookingDate === date &&
          b.bookingTime === time &&
          b.status !== 'CANCELLED'
        );

        if (conflict) {
          alert('This table was just reserved by another guest. Please select another table.');
          return;
        }

        const ref = `BK-2026-${Math.floor(10000 + Math.random() * 90000)}`;
        const booking = {
          id: Date.now(),
          bookingReference: ref,
          userId: currentUser?.id || 2,
          customerName: guestName,
          customerEmail: guestEmail,
          customerPhone: guestPhone,
          restaurantId: restaurant.id,
          restaurantName: restaurant.name,
          tableId: selectedTable.id,
          tableNumber: selectedTable.tableNumber,
          zone: selectedTable.zone,
          bookingDate: date,
          bookingTime: time,
          guestCount: guests,
          specialRequests: `Occasion: ${occasion}. ${specialRequests}`,
          status: 'CONFIRMED'
        };

        setConfirmedRef(ref);
        onConfirmBooking(booking);
        setStep(4);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md overflow-y-auto">
          <div className="bg-[#181817] rounded-3xl border border-stone-800 p-6 sm:p-8 max-w-xl w-full my-8 space-y-6">
            
            <div className="flex items-center justify-between pb-4 border-b border-stone-800">
              <div>
                <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400">Step {step} of 3</span>
                <h3 className="font-serif text-2xl font-bold text-white mt-0.5">{restaurant.name}</h3>
              </div>
              <button onClick={onClose} className="text-stone-400 hover:text-white text-lg">✕</button>
            </div>

            {/* STEP 1: Date & Time */}
            {step === 1 && (
              <div className="space-y-4 text-xs">
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="text-stone-400 font-semibold uppercase block mb-1">Date</label>
                    <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="w-full p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-white" />
                  </div>
                  <div>
                    <label className="text-stone-400 font-semibold uppercase block mb-1">Guests</label>
                    <select value={guests} onChange={(e) => setGuests(parseInt(e.target.value))} className="w-full p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-white">
                      {[1, 2, 4, 6, 8, 10].map(n => <option key={n} value={n}>{n} Guests</option>)}
                    </select>
                  </div>
                </div>

                <div>
                  <label className="text-stone-400 font-semibold uppercase block mb-2">Available Seating Times</label>
                  <div className="grid grid-cols-4 gap-2">
                    {['18:00', '18:30', '19:00', '19:30', '20:00', '20:30', '21:00', '21:30'].map(t => (
                      <button 
                        key={t}
                        onClick={() => setTime(t)}
                        className={`p-2 rounded-xl text-center font-bold ${time === t ? 'bg-amber-500 text-black' : 'bg-stone-900 text-stone-300 hover:bg-stone-800'}`}
                      >
                        {t}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="pt-4 flex justify-end">
                  <button onClick={() => setStep(2)} className="px-6 py-3 rounded-2xl bg-amber-500 text-black font-bold uppercase tracking-wider">
                    Next: Floor & Table →
                  </button>
                </div>
              </div>
            )}

            {/* STEP 2: Interactive Table Floor Plan */}
            {step === 2 && (
              <div className="space-y-4 text-xs">
                <div>
                  <h4 className="font-bold text-white mb-1">Select Your Table on the Floor Plan</h4>
                  <p className="text-stone-400">Green = Available, Red = Booked</p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  {computedTables.map(t => {
                    const selected = selectedTable?.id === t.id;
                    return (
                      <button
                        key={t.id}
                        disabled={!t.isAvailable}
                        onClick={() => setSelectedTable(t)}
                        className={`p-3.5 rounded-2xl border text-left transition-all flex flex-col justify-between min-h-[90px] ${
                          selected 
                            ? 'bg-amber-500 text-black border-amber-300 ring-2 ring-amber-400' 
                            : !t.isAvailable 
                            ? 'bg-stone-900/40 border-stone-800 opacity-40 cursor-not-allowed' 
                            : 'bg-stone-900 border-emerald-500/40 text-stone-200 hover:border-emerald-400'
                        }`}
                      >
                        <div className="flex justify-between items-center w-full">
                          <span className="font-mono font-bold">{t.tableNumber}</span>
                          <span>{t.isAvailable ? '🟢' : '🔒'}</span>
                        </div>
                        <div className="my-1">
                          <span className="font-semibold">{t.capacity} Seats</span>
                          <p className="text-[10px] opacity-80">{t.zone}</p>
                        </div>
                        <span className="text-[9px] uppercase font-bold">{selected ? 'Selected' : t.isAvailable ? 'Available' : 'Booked'}</span>
                      </button>
                    );
                  })}
                </div>

                <div className="pt-4 flex justify-between items-center">
                  <button onClick={() => setStep(1)} className="text-stone-400 hover:text-white">← Back</button>
                  <button 
                    disabled={!selectedTable}
                    onClick={() => setStep(3)} 
                    className="px-6 py-3 rounded-2xl bg-amber-500 disabled:opacity-40 text-black font-bold uppercase tracking-wider"
                  >
                    Next: Guest Info →
                  </button>
                </div>
              </div>
            )}

            {/* STEP 3: Guest Info */}
            {step === 3 && (
              <div className="space-y-4 text-xs">
                <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-400">
                  Reserving <strong>Table {selectedTable.tableNumber} ({selectedTable.zone})</strong> for {guests} guests on {date} at {time}.
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="text-stone-400 font-semibold block mb-1">Lead Guest Name</label>
                    <input type="text" value={guestName} onChange={(e) => setGuestName(e.target.value)} className="w-full p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-white" />
                  </div>
                  <div>
                    <label className="text-stone-400 font-semibold block mb-1">Email Address</label>
                    <input type="email" value={guestEmail} onChange={(e) => setGuestEmail(e.target.value)} className="w-full p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-white" />
                  </div>
                </div>

                <div>
                  <label className="text-stone-400 font-semibold block mb-1">Special Occasion</label>
                  <select value={occasion} onChange={(e) => setOccasion(e.target.value)} className="w-full p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-white">
                    <option value="Anniversary">Anniversary Celebration</option>
                    <option value="Birthday">Birthday</option>
                    <option value="Business Dinner">Business Dinner</option>
                    <option value="Date Night">Date Night</option>
                  </select>
                </div>

                <div>
                  <label className="text-stone-400 font-semibold block mb-1">Dietary Preferences</label>
                  <textarea rows={2} value={specialRequests} onChange={(e) => setSpecialRequests(e.target.value)} className="w-full p-2.5 rounded-xl bg-stone-900 border border-stone-800 text-white"></textarea>
                </div>

                <div className="pt-4 flex justify-between items-center">
                  <button onClick={() => setStep(2)} className="text-stone-400 hover:text-white">← Back</button>
                  <button onClick={handleConfirm} className="px-8 py-3 rounded-2xl bg-gradient-to-r from-amber-600 to-amber-500 text-black font-extrabold uppercase tracking-wider">
                    Confirm Reservation ✦
                  </button>
                </div>
              </div>
            )}

            {/* STEP 4: Confirmed Screen */}
            {step === 4 && (
              <div className="text-center py-6 space-y-4">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 border-2 border-emerald-400 text-emerald-400 flex items-center justify-center mx-auto text-3xl">
                  ✓
                </div>
                <h3 className="font-serif text-3xl font-bold text-white">Reservation Confirmed!</h3>
                <p className="text-xs text-stone-400">Your table is locked and guaranteed.</p>
                
                <div className="p-4 rounded-2xl bg-[#1C1C1A] border border-stone-800 max-w-sm mx-auto text-left text-xs space-y-2">
                  <div className="flex justify-between">
                    <span className="text-stone-400">Booking Code:</span>
                    <strong className="font-mono text-amber-400 text-sm">{confirmedRef}</strong>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-400">Restaurant:</span>
                    <strong className="text-white">{restaurant.name}</strong>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-400">Seating:</span>
                    <strong className="text-white">Table {selectedTable?.tableNumber} ({selectedTable?.zone})</strong>
                  </div>
                  <div className="flex justify-between">
                    <span className="text-stone-400">Date & Time:</span>
                    <strong className="text-white">{date} at {time}</strong>
                  </div>
                </div>

                <button onClick={onClose} className="px-6 py-2.5 rounded-xl bg-amber-500 text-black font-bold uppercase text-xs">
                  Done
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
